[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
xfail_strict = false
markers =
    m1: Module 1 - User Authentication
    m2: Module 2 - Checkout and Order Placement
    m3: Module 3 - Utilities and Public Pages
    unit: Single function tests (no HTTP request)
    route: Flask route tests through the test client
    security: CSRF, open redirect, access control, password hashing
    boundary: Boundary value analysis cases
    smoke: Quick sanity checks, run first inside each module
    priority(n): Run order inside a module, lower number runs first (default 5)
    xdist_group(name): Keeps one module on one worker when running in parallel
